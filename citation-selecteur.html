<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">

	<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

		.important{ background: rgb(124, 46, 4);}

			img{ max-width: 100%; }

</head>
<body>
	<div class="citations" id="pepito">

	<div class="citations" id="pickle">

	</div>
